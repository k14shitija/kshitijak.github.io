    :root {
      --bg: #020617;
      --bg-alt: #020617;
      --panel: #020617;
      --panel-soft: #020617;
      --accent: #38bdf8;
      --accent-2: #4ade80;
      --accent-soft: rgba(56,189,248,0.12);
      --accent-soft-2: rgba(129,140,248,0.22);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --shadow-soft: 0 24px 70px rgba(0,0,0,0.75);
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background:
        radial-gradient(circle at 0% -20%, #0f172a 0, transparent 50%),
        radial-gradient(circle at 100% 0%, #1f2937 0, transparent 55%),

      color: var(--text);
      line-height: 1.6;
      padding: 32px 16px 80px;
      min-height: 100vh;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      position: relative;
    }

    /* WATERMARKS */

    .watermark {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.05;
      font-weight: 700;
      font-size: 5rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      mix-blend-mode: screen;
    }

    .watermark span {
      position: absolute;
      white-space: nowrap;
    }

    .watermark .porsche {
      top: 10%;
      left: 6%;
      transform: rotate(-18deg);
    }

    .watermark .mercedes {
      bottom: 6%;
      right: 4%;
      transform: rotate(15deg);
      font-size: 4.4rem;
    }

    /* HEADER */

    header {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.4fr);
      gap: 26px;
      margin-bottom: 40px;
      padding: 22px 24px 22px;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at top left, #0f172a 0, #020617 55%);
      border: 1px solid rgba(15,23,42,0.9);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
